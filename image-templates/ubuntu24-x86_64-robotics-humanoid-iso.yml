# Robotics Humanoid AI Suite: Full ROS 2 Jazzy ISO Image Template
# Ubuntu 24.04 LTS + ROS 2 Jazzy Desktop + Intel OpenVINO + Gazebo Harmonic +
# Intel RealSense + Robotics SDK + Collab SLAM + Intel GPU/NPU support for humanoid platforms
#
# Bootable ISO installer image. Flash to USB, boot, and install to internal drive.
# Includes ROS 2 Jazzy Desktop, Intel OpenVINO 2025, Gazebo Harmonic physics simulator,
# Intel RealSense camera libraries (DKMS), Intel NPU drivers, and more.
#
# Usage:
#   sudo -E ./image-composer-tool build image-templates/ubuntu24-x86_64-robotics-humanoid-iso.yml
#
# Flash to USB:
#   sudo dd if=builds/robotics-humanoid-ubuntu24-24.04.iso of=/dev/sdX bs=4M status=progress conv=fsync
#
# Boot from USB, then the live-installer writes to the target drive.
#
# ROS 2 is auto-sourced on login. Run demos:
#   ros2 run turtlesim turtlesim_node &
#   ros2 run demo_nodes_cpp talker &
#   ros2 run demo_nodes_cpp listener &
#
# OpenVINO inference example:
#   ros2 launch openvino_node openvino_node.launch.py
#
# Gazebo Harmonic simulation:
#   gz sim shapes.sdf

# AI-searchable metadata for template discovery
metadata:
  description: Bootable ISO installer for ROS 2 Jazzy humanoid robotics image with Intel OpenVINO, Gazebo Harmonic, RealSense, and Intel GPU/NPU support
  use_cases:
    - Humanoid robotics development environment
    - ROS 2 Jazzy Desktop with all tools
    - Intel OpenVINO AI inference on robot platforms
    - Gazebo Harmonic physics simulation
    - Intel RealSense depth camera integration
    - Collaborative SLAM (collab-slam-lze)
    - Intel GPU acceleration (Xe/UHD Graphics)
    - Intel NPU inference offload
    - Edge humanoid robot deployments
    - Bootable USB installation media
    - Bare metal provisioning
  keywords:
    - robotics
    - humanoid
    - ros2
    - jazzy
    - openvino
    - gazebo
    - harmonic
    - realsense
    - slam
    - intel
    - gpu
    - npu
    - level-zero
    - dkms
    - ubuntu
    - iso
    - bootable
    - installer

image:
  name: robotics-humanoid-ubuntu24
  version: "24.04"

target:
  os: ubuntu
  dist: ubuntu24
  arch: x86_64
  imageType: iso

packageRepositories:
  # ROS 2 Jazzy repository
  - codename: "noble"
    url: "http://packages.ros.org/ros2/ubuntu"
    pkey: "https://raw.githubusercontent.com/ros/rosdistro/master/ros.key"
    component: "main"

  # Intel Edge Controls for Industrial (ECI) repository
  # Priority 1000 ensures ECI packages (systemd+ETF/taprio, PCL+oneAPI, FLANN+oneAPI)
  # are preferred over Ubuntu defaults when version strings differ.
  # No allowPackages filter — ECI packages have deep transitive dependency chains
  # that require many ECI-only sub-packages to satisfy.
  - codename: "isar"
    url: "https://eci.intel.com/repos/noble"
    pkey: "https://eci.intel.com/repos/gpg-keys/GPG-PUB-KEY-INTEL-ECI.gpg"
    component: "main"
    priority: 1000

  # Intel AMR (Autonomous Mobile Robots) repository (uses ECI GPG key)
  # Priority 1001 (above ECI) — AMR packages override ECI when both provide the same package.
  - codename: "amr"
    url: "https://amrdocs.intel.com/repos/noble"
    pkey: "https://eci.intel.com/repos/gpg-keys/GPG-PUB-KEY-INTEL-ECI.gpg"
    component: "main"
    priority: 1001

  # Intel OneAPI runtime repository
  - codename: "all"
    url: "https://apt.repos.intel.com/oneapi"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "main"

  # Intel OpenVINO 2025 repository
  - codename: "ubuntu24"
    url: "https://apt.repos.intel.com/openvino"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "main"

  # Gazebo (OSRF) Harmonic stable repository
  - codename: "noble"
    url: "https://packages.osrfoundation.org/gazebo/ubuntu-stable"
    pkey: "https://packages.osrfoundation.org/gazebo.gpg"
    component: "main"

  # Intel RealSense repository (new URL as of 2026)
  - codename: "noble"
    url: "https://librealsense.realsenseai.com/Debian/apt-repo"
    pkey: "https://librealsense.realsenseai.com/Debian/librealsenseai.asc"
    component: "main"

systemConfig:
  name: robotics-humanoid
  description: Intel Robotics Humanoid AI Suite - Full ROS 2 Jazzy with OpenVINO, Gazebo, RealSense, and Intel GPU/NPU

  additionalFiles:
    - local: additionalfiles/ubuntu24-robotics-humanoid/10_eci_experimental
      final: /etc/grub.d/10_eci_experimental
    - local: additionalfiles/ubuntu24-robotics-humanoid/rt-optimization.service
      final: /usr/share/ei_sdk/rt-optimization.service
    - local: additionalfiles/ubuntu24-robotics-humanoid/rt-optimization.service
      final: /etc/systemd/system/rt-optimization.service
    - local: additionalfiles/ubuntu24-robotics-humanoid/rt_os_runtime_tuning.sh
      final: /usr/share/ei_sdk/rt_os_runtime_tuning.sh
    - local: additionalfiles/ubuntu24-robotics-humanoid/gpu-forcewake.service
      final: /usr/share/ei_sdk/gpu-forcewake.service
    - local: additionalfiles/ubuntu24-robotics-humanoid/gpu-forcewake.service
      final: /etc/systemd/system/gpu-forcewake.service
    - local: additionalfiles/ubuntu24-robotics-humanoid/gpu-freq-control.service
      final: /usr/share/ei_sdk/gpu-freq-control.service
    - local: additionalfiles/ubuntu24-robotics-humanoid/gpu-freq-control.service
      final: /etc/systemd/system/gpu-freq-control.service
    - local: additionalfiles/ubuntu24-robotics-humanoid/xe-freq-control.sh
      final: /usr/share/ei_sdk/xe-freq-control.sh
    - local: additionalfiles/ubuntu24-robotics-humanoid/linux-gpu-compute-runtime-v26.09.37435.1-ubuntu2404.tar.gz
      final: /tmp/gpu-driver/linux-gpu-compute-runtime-v26.09.37435.1-ubuntu2404.tar.gz
    - local: additionalfiles/ubuntu24-robotics-humanoid/linux-npu-driver-v1.32.0.20260402-23905121947-ubuntu2404.tar.gz
      final: /tmp/npu-driver/linux-npu-driver-v1.32.0.20260402-23905121947-ubuntu2404.tar.gz
    - local: additionalfiles/ubuntu24-robotics-humanoid/openvino-wheelhouse-openvino-2025.4.0.tar.gz
      final: /usr/share/ei_sdk/openvino-wheelhouse-openvino-2025.4.0.tar.gz
    - local: additionalfiles/ubuntu24-robotics-humanoid/openvino-wheelhouse-openvino-2026.1.0.tar.gz
      final: /usr/share/ei_sdk/openvino-wheelhouse-openvino-2026.1.0.tar.gz
    - local: additionalfiles/ubuntu24-robotics-humanoid/openvino-wheelhouse-openvino-genai-2026.1.0.0.tar.gz
      final: /usr/share/ei_sdk/openvino-wheelhouse-openvino-genai-2026.1.0.0.tar.gz
    - local: additionalfiles/ubuntu24-robotics-humanoid/openvino.genai-2026.1.0.0.zip
      final: /usr/share/ei_sdk/openvino.genai-2026.1.0.0.zip
    - local: additionalfiles/ubuntu24-robotics-humanoid/linux-intel-experimental_6.17.11-r0-0eci3.tar.gz
      final: /usr/share/ei_sdk/kernel_sourcecode/linux-intel-experimental_6.17.11-r0-0eci3.tar.gz
    - local: additionalfiles/ubuntu24-robotics-humanoid/linux-intel-rt-experimental_6.17.11-r0-0eci5.tar.gz
      final: /usr/share/ei_sdk/kernel_sourcecode/linux-intel-rt-experimental_6.17.11-r0-0eci5.tar.gz
    - local: additionalfiles/ubuntu24-robotics-humanoid/rt-tests-2.6.tar.gz
      final: /usr/share/ei_sdk/rt-tests-2.6.tar.gz

  immutability:
    enabled: false

  packages:
    # ── Base system ──────────────────────────────────────────────────
    - ubuntu-minimal
    - ubuntu-desktop-minimal
    - systemd
    - systemd-resolved
    - systemd-timesyncd
    - openssh-server
    - network-manager
    - sudo
    - curl
    - wget
    - vim
    - software-properties-common
    - bash-completion
    - gnupg
    - lsb-release
    - debconf-utils
    - dmidecode
    - msr-tools
    - hwloc
    - cpuid
    - git
    - stress-ng
    - dpkg-dev
    - clinfo 
    - libnuma-dev
    - build-essential
    - libpci-dev
    - libcap-dev
    - gettext
    - libncurses-dev
    - python3-pip
    - python3.12-venv
    - customizations-grub
    - tree
    - tmux
    - htop
    - fonts-ubuntu
    - language-pack-en
    - language-pack-en-base
    - language-pack-gnome-en
    - language-pack-gnome-en-base
    - net-tools

    # Boot / initramfs (required for UKI)
    - dracut-core
    - cryptsetup-bin

    # ── Intel OneAPI runtime  ───────────────────
    # Listed before ros-jazzy-desktop so the resolver locks these versions
    - intel-oneapi-runtime-compilers
    - intel-oneapi-runtime-compilers-common
    - intel-oneapi-runtime-opencl

    # ── ROS 2 Jazzy Desktop (full) ──────────────────────────────────
    - ros-jazzy-desktop

    # ── Intel OpenVINO 2025 (pinned to 2025.3.0) ─────────────────────
    - openvino_2025.3.0.19807
    #- ros-jazzy-openvino-wrapper-lib
    #- ros-jazzy-openvino-node

    # ── Intel GPU / Level Zero ──────────────────────────────────────
    - libtbb12
    - libze1
    - libze-intel-gpu1

    # ── Gazebo Harmonic physics simulator ───────────────────────────
    - gz-harmonic

    # ── Intel Robotics SDK ───────────────────────────────────────────
    #- ros-jazzy-robotics-sdk

    # ── Collaborative SLAM (Intel Xe / UHD GPU accelerated) ──────────
    #- ros-jazzy-collab-slam-lze

    # ── Intel RealSense camera (DKMS + SDK, installed at build time) ──
    # Keep the exact kernel headers pinned to 7.0.0-34. The floating
    # linux-headers-generic/HWE stack drifts to 7.0.0-38 and breaks the
    # RealSense DKMS build on this template.
    - linux-headers-7.0.0-34-generic
    - librealsense2-dkms
    - librealsense2
    - ros-jazzy-librealsense2

    # ── Firmware ────────────────────────────────────────────────────
    - linux-firmware

    # ── Intel NPU (Neural Processing Unit) drivers ───────────────────
    #- intel-level-zero-npu
    #- intel-driver-compiler-npu

  kernel:
    cmdline: "console=ttyS0,115200 console=tty0 loglevel=7"
    # Pinned to 7.0.0-34 to avoid the known DKMS incompatibility with the
    # newer 7.0.0-38 HWE kernel in this robotics image.
    packages:
    #  - linux-image-7.0.0-34-generic
    #  - linux-headers-7.0.0-34-generic
      - linux-intel-experimental
      - linux-intel-rt-experimental

  configurations:
    # ── ROS 2 environment setup ────────────────────────────────────
    - cmd: "echo 'source /opt/ros/jazzy/setup.bash' >> /etc/bash.bashrc"
    - cmd: "echo 'export ROS_DOMAIN_ID=42' >> /etc/bash.bashrc"

    # ── Locale configuration (en_US.UTF-8) ─────────────────────────
    - cmd: "locale-gen en_US en_US.UTF-8"
    - cmd: "update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8"

    # ── Post-deployment APT version pinning (protects against bad upgrades) ──
    # Note: Origin-based priority pins (ECI=1000, AMR=1001) are auto-generated
    # by the provider from packageRepositories.priority fields.
    # Only version-specific pins that the provider cannot generate are listed here.
    #
    # Block old FLANN 1.19.x from ECI (prefer Ubuntu's FLANN 1.9.2)
    - cmd: "printf 'Package: libflann*\\nPin: version 1.19.*\\nPin-Priority: -1\\n\\nPackage: flann*\\nPin: version 1.19.*\\nPin-Priority: -1\\n' > /etc/apt/preferences.d/eci-flann-block"
    # Pin OneAPI packages (matches setup-robotics-jazzy.sh exactly)
    - cmd: "printf 'Package: intel-oneapi-runtime-*\\nPin: version 2026.1.*\\nPin-Priority: 1001\\n\\nPackage: intel-oneapi-compiler-*\\nPin: version 2026.1.*\\nPin-Priority: 1001\\n\\nPackage: intel-oneapi-mkl-*\\nPin: version 2026.1.*\\nPin-Priority: 1001\\n' > /etc/apt/preferences.d/oneapi"
    # OpenVINO version pins (match setup-robotics-jazzy.sh exactly)
    - cmd: "printf 'Package: openvino-libraries-dev\\nPin: version 2025.3.0*\\nPin-Priority: 1001\\n\\nPackage: openvino\\nPin: version 2025.3.0*\\nPin-Priority: 1001\\n\\nPackage: ros-jazzy-openvino-wrapper-lib\\nPin: version 2025.3.0*\\nPin-Priority: 1002\\n\\nPackage: ros-jazzy-openvino-node\\nPin: version 2025.3.0*\\nPin-Priority: 1002\\n' > /etc/apt/preferences.d/intel-openvino"
    # RealSense SDK version pin for post-deployment upgrade protection.
    #- cmd: "printf 'Package: librealsense2*\\nPin: version 2.56.5-0~realsense.17055\\nPin-Priority: 1001\\n\\nPackage: ros-jazzy-librealsense2*\\nPin: version 2.56.4*\\nPin-Priority: 1001\\n\\nPackage: ros-jazzy-realsense2*\\nPin: version 4.56.4*\\nPin-Priority: 1001\\n' > /etc/apt/preferences.d/librealsense"

    # ── Additional Ubuntu repository support ───────────────────────
    - cmd: "add-apt-repository -y universe"

    # ── Remove systemd-boot on this GRUB-based image ───────────────
    # systemd-boot is installed transitively on some Ubuntu builds and leaves
    # /boot/efi/loader/random-seed behind, which triggers ESP security warnings.
    - cmd: "printf 'Package: systemd-boot systemd-boot-efi\nPin: release *\nPin-Priority: -1\n' > /etc/apt/preferences.d/no-systemd-boot"
    - cmd: "dpkg --purge --force-all systemd-boot systemd-boot-efi 2>/dev/null || true"

    # ── Intel GPU runtime install (offline bundle) ──────────────────
    - cmd: "mkdir -p /tmp/gpu-driver"
    - cmd: "cd /tmp/gpu-driver && tar -xzf linux-gpu-compute-runtime-v26.09.37435.1-ubuntu2404.tar.gz --strip-components=1"
    - cmd: "cd /tmp/gpu-driver/linux-gpu-compute-runtime-v26.09.37435.1-ubuntu2404 && find . -maxdepth 1 -type f -name '*.deb' -print0 | xargs -0 dpkg -i"
    - cmd: "apt-get install -y --fix-broken -o Dpkg::Options::=\"--force-overwrite\" || true"
    - cmd: "rm -rf /tmp/gpu-driver"

    # ── Kernel source checkout for Intel experimental kernels ───────
    - cmd: "printf 'deb-src https://eci.intel.com/repos/noble isar main\\n' > /etc/apt/sources.list.d/eci-source.list"

    # ── debconf pre-selections for OpenVINO node ─────────────────────
    #- cmd: "echo 'ros-jazzy-openvino-node openvino-node/pip-proxy select true' | debconf-set-selections"
    #- cmd: "echo 'ros-jazzy-openvino-node openvino-node/models select true' | debconf-set-selections"

    # ── Intel NPU driver install (offline bundle) ───────────────────
    - cmd: "dpkg --purge --force-remove-reinstreq intel-driver-compiler-npu intel-fw-npu intel-level-zero-npu intel-level-zero-npu-dbgsym 2>/dev/null || true"
    - cmd: "mkdir -p /tmp/npu-driver"
    - cmd: "cd /tmp/npu-driver && tar -xf linux-npu-driver-v1.32.0.20260402-23905121947-ubuntu2404.tar.gz"
    - cmd: "find /tmp/npu-driver -name '*.deb' -print0 | xargs -0 dpkg -i"

    # ── GRUB customization ─────────────────────────────────────────
    - cmd: "chmod 0755 /etc/grub.d/10_eci_experimental"
    #- cmd: "update-grub"

    # ── Set hostname ────────────────────────────────────────────────
    - cmd: "echo 'robotics-humanoid' > /etc/hostname"

  provisioning:
    scripts:
      - name: setup-user-home
        local: additionalfiles/ubuntu24-robotics-humanoid/10-setup-user-home.sh
        final: /usr/local/sbin/setup-user-home.sh
        stage: first-boot
        order: 10
